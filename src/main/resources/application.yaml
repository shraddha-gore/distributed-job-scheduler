spring:
    application:
        name: job-scheduler

    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 5
            minimum-idle: 0

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        open-in-view: false

    flyway:
        enabled: true
        locations: classpath:db/migration

scheduler:
    batch-size: 10
    lease-duration: 60s
    fixed-delay: 1000ms
